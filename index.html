@media(prefers-reduced-motion:reduce){*{transition:none!important}}
body.locked .side,body.locked main,body.locked .tabs{display:none!important}
.ab:empty{display:none}.ab{position:fixed;inset:0;z-index:20;overflow:auto;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));background:radial-gradient(circle at 85% 12%,var(--amber) 0 54px,transparent 56px),linear-gradient(var(--sky1),var(--sky2))}

const t=k=>T[k][S.lang=='en'?0:1],L2=(a,b)=>S.lang=='en'?a:b;
const S={tab:'dash',lang:'en',th:'',w:'clear',off:false,opt:true,hour:11,demo:0,sel:6,sh:12,mon:5,acc:{},eff:[98,97,96,99,95,97,82,98,96,88,97,99],lh:11};
